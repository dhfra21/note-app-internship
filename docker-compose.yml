version: '3.8'

services:
  # Database (existing)
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: notes.App123
      POSTGRES_DB: notesDB
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - notes-network

  # Redis (for caching and rate limiting)
  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - notes-network

  # Backend (NestJS) - No changes to existing setup
  backend:
    build: ./backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:notes.App123@db:5432/notesDB
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - uploads:/app/uploads
    depends_on:
      - db
      - redis
    networks:
      - notes-network

  # Frontend (Next.js) - No changes to existing setup
  frontend:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
    depends_on:
      - backend
    networks:
      - notes-network

  # Nginx Reverse Proxy (NEW)
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/sites-available/notes-app
      - ./nginx-logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - notes-network
    command: >
      sh -c "cp /etc/nginx/sites-available/notes-app /etc/nginx/conf.d/default.conf &&
              nginx -g 'daemon off;'"

volumes:
  pgdata:
  uploads:

networks:
  notes-network:
    driver: bridge 