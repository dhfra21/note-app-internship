# Nginx Reverse Proxy Configuration for Notes App
# This file should be placed in /etc/nginx/sites-available/notes-app

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;  # 5 requests per minute for auth
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;  # 30 requests per minute for API
limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;  # 100 requests per minute for general

# Upstream backend servers
upstream frontend {
    server localhost:3000;
}

upstream backend {
    server localhost:3001;
}

server {
    listen 80;
    server_name localhost;  # Change to your domain in production

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend (Next.js) - No rate limiting for static content
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Backend API (NestJS) - With rate limiting
    location /api/ {
        # Rate limiting based on endpoint type
        location ~ ^/api/auth/(login|register) {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://backend;
        }
        
        location ~ ^/api/(notes|users) {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
        }
        
        # Default rate limiting for other API endpoints
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://backend;
        
        # Common proxy settings for all API endpoints
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Uploaded files (profile pictures) - Serve from backend
    location /uploads/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Add debugging headers
        add_header X-Upload-Path $request_uri;
        add_header X-Backend-URL "http://backend$request_uri";
        
        # Cache uploaded files for 1 hour
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Static files caching (Next.js static assets)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_pass http://frontend;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# Logging configuration
log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$http_x_forwarded_for"';

access_log /var/log/nginx/notes-app-access.log main;
error_log /var/log/nginx/notes-app-error.log; 